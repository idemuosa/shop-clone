services:
  # Static Frontend Site (Render Static Site)
  - type: web
    name: vivi-shop-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://vivi-shop-express.onrender.com

  # Node.js Express Gateway API Server
  - type: web
    name: vivi-shop-express
    env: node
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PYTHON_API
        value: https://vivi-shop-fastapi.onrender.com
      - key: CORE_ORIGIN
        value: https://vivi-shop-frontend.onrender.com,https://vivi-shop.vercel.app

  # Python FastAPI Backend Service
  - type: web
    name: vivi-shop-fastapi
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: backend
