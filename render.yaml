services:
  # Static Frontend Site (Render Static Site)
  - type: web
    name: vivi-shop-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://vivi-shop-express.onrender.com

  # Node.js Express Gateway API Server
  - type: web
    name: vivi-shop-express
    runtime: node
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORE_ORIGIN
        value: https://vivi-shop-frontend.onrender.com,https://vivi-shop.vercel.app
